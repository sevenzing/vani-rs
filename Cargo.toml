[package]
name = "vani-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Deterministic Ethereum vanity address search"
license = "MIT"
repository = "https://github.com/sevenzing/vani-rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
getrandom = "0.4.3"
hmac = "0.13.0"
k256 = "0.14.0"
regex = "1.13.1"
sha2 = "0.11.1"
sha3 = "0.12.0"
time = { version = "0.3.55", features = ["std"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
